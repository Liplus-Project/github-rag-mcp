name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/sync-release-version.test.mjs
      - run: node --test scripts/abstention-replay.test.mjs
      - run: node --test scripts/abstention-evaluation.test.mjs
      - run: node --experimental-strip-types --test scripts/document-tail.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts -p 'document_tail_test.py'
      - run: npm ci
      - run: npm ci
        working-directory: mcp-server
      - run: npm test
        working-directory: mcp-server
      - run: node scripts/check-schema-drift.mjs
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run --outdir dist

  # Gate job: single Required status check for branch protection.
  # Add new jobs to `needs` when CI grows. No Settings change needed.
  CI:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "CI failed: test=${{ needs.test.result }}"
            exit 1
          fi
